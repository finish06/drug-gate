name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Unit Tests
        run: go test ./... -short -count=1

      - name: Integration Tests
        run: REDIS_URL=localhost:6379 go test -tags=integration -count=1 -v ./...

      - name: Coverage
        run: |
          go test $(go list ./... | grep -v /cmd/) -tags=integration -coverprofile=coverage.out -count=1
          go tool cover -func=coverage.out | tail -1
        env:
          REDIS_URL: localhost:6379

      - name: Build
        run: go build ./cmd/server

  e2e:
    runs-on: ubuntu-latest
    # Non-blocking: cash-drugs pulls live data from FDA/DailyMed, so an upstream
    # hiccup must not turn unrelated PRs red. Failures surface as a warning
    # annotation; this job never fails the workflow. Run the full suite locally
    # (blocking) with `make test-e2e`.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Log in to private registry (cash-drugs image)
        uses: docker/login-action@v3
        with:
          registry: dockerhub.calebdunn.tech
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Start e2e stack
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for stack to be ready
        run: |
          echo "Waiting for cash-drugs..."
          for _ in $(seq 1 60); do
            if docker compose -f docker-compose.e2e.yml exec -T cash-drugs wget -q --spider http://localhost:8080/health 2>/dev/null; then
              echo "cash-drugs ready"; break
            fi
            sleep 2
          done
          echo "Waiting for drug-gate..."
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:18081/health >/dev/null 2>&1; then
              echo "drug-gate ready"; break
            fi
            sleep 2
          done

      - name: Run e2e tests
        id: e2e
        continue-on-error: true
        run: |
          DRUG_GATE_URL=http://localhost:18081 ADMIN_SECRET=e2e-test-secret \
            go test -tags=e2e -count=1 -v ./tests/e2e/...

      - name: Report e2e result
        if: steps.e2e.outcome == 'failure'
        run: echo "::warning::e2e tests failed or were flaky (non-blocking — cash-drugs depends on live FDA/DailyMed APIs). See the 'Run e2e tests' step logs."

      - name: Dump drug-gate logs on failure
        if: steps.e2e.outcome == 'failure'
        run: docker compose -f docker-compose.e2e.yml logs --no-color drug-gate cash-drugs

      - name: Tear down e2e stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      version: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
      image_digest: ${{ steps.release_build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Set version
        id: version
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=beta-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: dockerhub.calebdunn.tech
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push beta
        if: steps.version.outputs.is_release == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            GIT_COMMIT=${{ steps.version.outputs.short_sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          tags: dockerhub.calebdunn.tech/finish06/drug-gate:beta

      - name: Trigger staging deploy
        id: deploy
        if: steps.version.outputs.is_release == 'false' && success()
        run: |
          BODY='{"app":"drug-gate","ref":"${{ github.ref }}","sha":"${{ github.sha }}","tag":"${{ steps.version.outputs.tag }}"}'
          SIGNATURE="sha256=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" | awk '{print $NF}')"
          echo "Triggering staging deploy..."
          HTTP_CODE=$(curl -s -o /tmp/deploy-response.json -w "%{http_code}" \
            -X POST "${{ secrets.STAGING_WEBHOOK_URL }}/deploy" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$BODY")
          echo "Deploy response (HTTP $HTTP_CODE):"
          cat /tmp/deploy-response.json
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::warning::Staging deploy returned HTTP $HTTP_CODE"
            echo "deploy_ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_ok=true" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: k6 smoke test
        if: steps.deploy.outputs.deploy_ok == 'true'
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/k6/staging.js
          flags: --env SCENARIO=smoke --env BASE_URL=https://drug-gate.staging.calebdunn.tech --env API_KEY=${{ secrets.STAGING_API_KEY }}
        continue-on-error: true

      - name: Build and push release
        id: release_build
        if: steps.version.outputs.is_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=v${{ steps.version.outputs.tag }}
            GIT_COMMIT=${{ steps.version.outputs.short_sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          tags: |
            dockerhub.calebdunn.tech/finish06/drug-gate:${{ steps.version.outputs.tag }}
            dockerhub.calebdunn.tech/finish06/drug-gate:latest
            ghcr.io/finish06/drug-gate:${{ steps.version.outputs.tag }}
            ghcr.io/finish06/drug-gate:latest

  # Announce a release to the homelab bus AFTER the image is built + pushed.
  # Only on v* tags; the agent ("Joe") prompts a human in Discord to promote.
  # See ops/production-deploy.md / specs/deploy-automation.md.
  notify-prod:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && needs.publish.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    env:
      APP_NAME: drug-gate
      IMAGE_PATH: dockerhub.calebdunn.tech/finish06/drug-gate
    steps:
      - name: Publish promote event to NATS bridge
        env:
          NATS_BRIDGE_KEY: ${{ secrets.NATS_BRIDGE_KEY }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.publish.outputs.image_digest }}
          VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          SUBJECT="joe.deploy.${APP_NAME}.tag.${TAG}"
          PAYLOAD=$(jq -nc \
            --arg tag "$TAG" \
            --arg digest "${DIGEST:-pending}" \
            --arg image "${IMAGE_PATH}:${VERSION}" \
            --arg release_url "$RELEASE_URL" \
            --arg run_url "$RUN_URL" \
            --arg actor "$ACTOR" \
            --arg sha "$SHA" \
            '{tag:$tag, digest:$digest, registry_path:$image, release_url:$release_url, workflow_run_url:$run_url, actor:$actor, sha:$sha}')
          echo "Publishing to subject: $SUBJECT"
          echo "Payload: $PAYLOAD"
          HTTP=$(curl -sS -o /tmp/nats-resp -w '%{http_code}' -X POST \
            "https://nats-publish.kube.calebdunn.tech/publish/$SUBJECT" \
            -H "Authorization: Bearer $NATS_BRIDGE_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true)
          echo "Bridge HTTP $HTTP"; cat /tmp/nats-resp 2>/dev/null || true
          if [ "$HTTP" != "202" ] && [ "$HTTP" != "200" ]; then
            echo "::error::NATS bridge returned $HTTP (expected 202). Event not published."
            exit 1
          fi
